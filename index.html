<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Surge PhD Cohort Meetings</title>
<script>
/* Apply a saved light/dark choice before the page paints, so it does not flash. */
try{var _t=localStorage.getItem('rh-theme');if(_t==='dark'||_t==='light')document.documentElement.setAttribute('data-theme',_t)}catch(e){}
</script>
<style>
/* Concept: a scholarly almanac. Georgia throughout, navy ink on cool paper, gold only for "now" (next session, today). The next-session panel is the single bold block; everything else stays quiet. Library entries read like reference-list citations. */
:root{
  --serif:Georgia,"Times New Roman",Times,serif;
  --bg:#F4F5FA; --surface:#FFFFFF; --surface-2:#ECEEF6; --fg:#121733; --muted:#59607F; --line:#D9DCEA;
  --accent:#1C4E9D; --accent-text:#173F80; --accent-soft:#E2EAF8; --accent-ink:#FFFFFF;
  --gold:#B7791F; --gold-text:#7A4E08; --gold-soft:#FBEED0;
  --hero-bg:#101C45; --hero-fg:#F3F5FC; --hero-muted:#B3BCDD; --hero-gold:#F0C25E; --hero-line:rgba(255,255,255,.18);
  --good:#17653A; --good-soft:#DCF0E3;
  --danger:#A8231C; --danger-soft:#FBE0DE;
  --shadow:0 1px 2px rgba(16,28,69,.06),0 8px 24px -12px rgba(16,28,69,.18);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1022; --surface:#111A33; --surface-2:#1A2547; --fg:#E8EBF7; --muted:#9AA3C4; --line:#25315A;
    --accent:#86B4F5; --accent-text:#A9CAFA; --accent-soft:#16264A; --accent-ink:#0A1022;
    --gold:#EDC15E; --gold-text:#EDC15E; --gold-soft:#3A2D0E;
    --hero-bg:#16255A; --hero-fg:#F1F4FD; --hero-muted:#AEB8DC; --hero-gold:#F0C25E; --hero-line:rgba(255,255,255,.18);
    --good:#6FD08C; --good-soft:#143020;
    --danger:#FF8F86; --danger-soft:#3D1C1A;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1022; --surface:#111A33; --surface-2:#1A2547; --fg:#E8EBF7; --muted:#9AA3C4; --line:#25315A;
  --accent:#86B4F5; --accent-text:#A9CAFA; --accent-soft:#16264A; --accent-ink:#0A1022;
  --gold:#EDC15E; --gold-text:#EDC15E; --gold-soft:#3A2D0E;
  --hero-bg:#16255A; --hero-fg:#F1F4FD; --hero-muted:#AEB8DC; --hero-gold:#F0C25E; --hero-line:rgba(255,255,255,.18);
  --good:#6FD08C; --good-soft:#143020;
  --danger:#FF8F86; --danger-soft:#3D1C1A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--serif);font-size:16px;line-height:1.55;padding-inline:16px;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select{font-family:inherit}
[hidden]{display:none!important}
.wrap{max-width:1120px;margin-inline:auto;padding-bottom:40px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{font-family:var(--serif);margin:0;text-wrap:balance;line-height:1.18}
p{margin:0}
a{color:var(--accent-text)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:flex-end;flex-wrap:wrap;gap:0 32px;padding-top:18px;border-bottom:1px solid var(--line)}
.brand{padding-bottom:10px;min-width:0}
.brand h1{font-size:clamp(1.3rem,1.05rem + 1vw,1.7rem);font-weight:700;letter-spacing:-.01em}
.brand span{display:block;font-style:italic;font-size:14px;color:var(--muted);margin-top:2px}
.tabs{display:flex;gap:6px}
.tab{border:0;background:none;padding:11px 8px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--gold)}
.fresh{margin-left:auto;margin-bottom:9px;display:flex;align-items:center;gap:10px;font-size:13px;font-style:italic;color:var(--muted)}

/* buttons, pills, chips */
.btn{font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:6px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;line-height:1.3}
.btn:hover{background:var(--surface-2)}
.btn.small{padding:4px 10px;font-size:13px}
.btn.icon{padding:5px 8px}
.btn.icon svg{display:block}
.btn[disabled]{opacity:.6;cursor:default}
.linkbtn{border:0;background:none;padding:0;font-size:13.5px;font-style:italic;color:var(--accent-text);cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.linkbtn:hover{text-decoration-color:var(--accent)}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12.5px;white-space:nowrap}
.pill.acc{background:var(--accent-soft);color:var(--accent-text)}
.pill.warn{background:var(--gold-soft);color:var(--gold-text);font-weight:700}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.mute{background:var(--surface-2);color:var(--muted)}
.pill.ex{border:1px dashed var(--muted);color:var(--muted);background:none}
.chip{display:inline-block;border:1px solid var(--line);color:var(--muted);padding:1px 9px;border-radius:4px;font-size:12.5px}

.note{background:var(--accent-soft);color:var(--accent-text);border-radius:6px;padding:10px 14px;margin-top:18px;font-size:14.5px}
.note.bad{background:var(--danger-soft);color:var(--danger)}

/* next session: the one bold block */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 40px;align-items:start;background:var(--hero-bg);color:var(--hero-fg);border-radius:10px;padding:28px 30px 22px;margin-top:24px;box-shadow:var(--shadow)}
.hero .eyebrow{color:var(--hero-gold)}
.hero a{color:var(--hero-gold)}
.next-title{font-size:clamp(1.65rem,1.1rem + 2.4vw,2.6rem);font-weight:700;margin-top:10px;letter-spacing:-.015em;overflow-wrap:anywhere}
.next-meta{display:flex;flex-wrap:wrap;gap:4px 20px;margin-top:12px;color:var(--hero-muted);font-size:16px}
.next-meta b{color:var(--hero-fg);font-weight:400}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.hero .btn{background:transparent;color:var(--hero-fg);border-color:var(--hero-line)}
.hero .btn:hover{background:rgba(255,255,255,.1)}
.hero-side{grid-column:2;grid-row:1 / span 3;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:104px}
.hero-side .hnum{font-size:72px;line-height:1;font-weight:700;color:var(--hero-gold)}
.hero-side .hmon{font-style:italic;color:var(--hero-muted);font-size:15px}
.hero .pill{background:rgba(255,255,255,.12);color:var(--hero-gold);margin-top:8px}
.stats{grid-column:1 / -1;list-style:none;display:flex;flex-wrap:wrap;gap:10px 44px;margin:18px 0 0;padding:16px 0 0;border-top:1px solid var(--hero-line);color:var(--hero-muted);font-size:14.5px}
.stats li{display:flex;align-items:baseline;gap:10px}
.stats b{font-size:30px;line-height:1;font-weight:700;color:var(--hero-fg)}
.hero-empty h2{font-size:26px;margin-top:10px}
.hero-empty p{color:var(--hero-muted);margin-top:6px}
.loading{color:var(--muted);font-style:italic;padding:8px 0}
.hero .loading{color:var(--hero-muted)}

main{padding-top:30px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:32px;align-items:start}
.col-main{min-width:0}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;background:var(--surface);overflow:hidden}
.seg-btn{border:0;background:none;padding:7px 14px;font-size:14px;color:var(--muted);cursor:pointer}
.seg-btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
select,input{font-size:16px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0;max-width:100%}
.search{flex:1 1 220px}
.search input{width:100%}
.chip-btn{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent-text);border-radius:999px;padding:4px 14px;font-size:13.5px;cursor:pointer}
.count{font-size:13.5px;font-style:italic;color:var(--muted);margin:14px 0 0}

/* timetable */
.group-h{display:flex;align-items:center;gap:14px;font-size:21px;font-style:italic;font-weight:400;margin:26px 0 10px}
.group-h::after{content:"";flex:1;height:1px;background:var(--line)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding-inline:20px}
.row{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:4px 20px;padding:18px 0;align-items:start}
.row + .row,.entry + .entry{border-top:1px solid var(--line)}
.dt{text-align:center;line-height:1.15}
.dt .dow,.dt .mon{display:block;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.dt .dnum{display:block;font-size:32px;font-weight:700;margin:3px 0}
.row.today .dnum{color:var(--gold-text)}
.title{font-weight:700;font-size:18px;overflow-wrap:anywhere}
.row.past .title{color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:2px 16px;color:var(--muted);font-size:15px;margin-top:3px}
.meta .time{color:var(--fg)}
.sub{color:var(--muted);font-size:15px;margin-top:8px;overflow-wrap:anywhere}
.sub b{color:var(--fg)}
.sub i{color:var(--fg)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}

/* calendar */
.col-side{min-width:0}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-title{font-size:18px;font-style:italic}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.cal-dow{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-align:center;padding:4px 0}
.cal-day{aspect-ratio:1;min-width:0;border:0;background:none;border-radius:6px;font-size:15px;color:var(--fg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;padding:0}
.cal-day:hover{background:var(--surface-2)}
.cal-day.today{box-shadow:inset 0 0 0 1.5px var(--gold)}
.cal-day.sel{background:var(--accent);color:var(--accent-ink)}
.cal-day i{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.cal-day i.past{background:var(--muted)}
.cal-day i.none{visibility:hidden}
.cal-day.sel i{background:var(--accent-ink)}
.cal-blank{aspect-ratio:1}
.cal-foot{font-size:13px;font-style:italic;color:var(--muted);margin-top:12px}

/* library, set like a reference list */
.entry{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:8px 32px;padding:20px 0}
.entry h3{font-size:18px;font-weight:700;overflow-wrap:anywhere}
.entry h3 a{color:var(--fg);text-decoration-color:var(--gold);text-underline-offset:4px;text-decoration-thickness:1.5px}
.cite{font-size:15px;color:var(--muted);margin-top:5px;overflow-wrap:anywhere}
.cite i{color:var(--fg)}
.em{display:flex;flex-direction:column;gap:8px;align-items:flex-start;min-width:0;border-left:1px solid var(--line);padding-left:24px}
.em .when{font-size:14.5px;color:var(--muted);line-height:1.4}
.em .when b{display:block;font-size:16px;color:var(--fg);font-weight:700}
.slides{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.empty{border:1px dashed var(--line);border-radius:8px;padding:34px 20px;text-align:center;color:var(--muted);margin-top:14px}
.empty h3{color:var(--fg);font-size:20px;margin-bottom:6px}
.empty .btn{margin-top:14px}
.foot{margin-top:44px;padding-top:16px;border-top:1px solid var(--line);font-size:13.5px;font-style:italic;color:var(--muted)}

/* slide preview */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(6,10,26,.72);display:flex;justify-content:center;align-items:center;padding:16px}
.viewer{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:10px;width:100%;max-width:960px;height:min(86vh,720px);display:flex;flex-direction:column;overflow:hidden}
.viewer-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.viewer-head h2{font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.viewer iframe{flex:1;border:0;width:100%;background:var(--surface-2)}

@media (max-width:860px){
  .cols{grid-template-columns:minmax(0,1fr)}
  .col-side{order:-1}
}
@media (max-width:640px){
  .hero{grid-template-columns:minmax(0,1fr);padding:22px 20px 18px}
  .hero-side{grid-column:1;grid-row:auto;flex-direction:row;align-items:baseline;justify-content:flex-start;gap:10px;text-align:left}
  .hero-side .hnum{font-size:44px}
  .hero-side .pill{margin-top:0;margin-left:auto;align-self:center}
  .row{grid-template-columns:46px minmax(0,1fr);gap:4px 14px}
  .row .side{grid-column:2;flex-direction:row;align-items:center;justify-content:flex-start;flex-wrap:wrap}
  .list{padding-inline:16px}
  .entry{grid-template-columns:minmax(0,1fr)}
  .em{border-left:0;padding-left:0}
  .fresh{margin-left:0;width:100%;margin-bottom:10px}
  .stats{gap:10px 28px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1>Surge PhD Cohort Meetings</h1><span>2026–2030 · timetable and presentation archive</span></div>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button class="tab" role="tab" id="tab-timetable" aria-controls="panel-timetable" aria-selected="true" data-act="tab" data-tab="timetable">Timetable</button>
      <button class="tab" role="tab" id="tab-library" aria-controls="panel-library" aria-selected="false" data-act="tab" data-tab="library">Library</button>
    </nav>
    <div class="fresh"><span id="updated"></span><button class="btn small" id="refreshBtn" data-act="refresh">Refresh</button><button class="btn small icon" id="themeBtn" data-act="theme" aria-label="Switch theme" title="Switch between light and dark"></button></div>
  </header>

  <div class="note" id="notice" hidden></div>
  <section class="hero" id="hero" aria-live="polite"><div class="loading">Loading the timetable…</div></section>

  <main>
    <section id="panel-timetable" role="tabpanel" aria-labelledby="tab-timetable">
      <div class="cols">
        <div class="col-main">
          <div class="filters">
            <div class="seg" role="group" aria-label="Show sessions">
              <button class="seg-btn" data-act="when" data-when="upcoming" aria-pressed="true">Upcoming</button>
              <button class="seg-btn" data-act="when" data-when="past" aria-pressed="false">Past</button>
              <button class="seg-btn" data-act="when" data-when="all" aria-pressed="false">All</button>
            </div>
            <select id="fPresenter" aria-label="Filter by presenter"><option value="">All presenters</option></select>
            <select id="fType" aria-label="Filter by session type"><option value="">All types</option></select>
            <button class="chip-btn" id="dayChip" data-act="clear-day" hidden></button>
          </div>
          <div id="sessionList"></div>
        </div>
        <aside class="col-side"><div class="cal" id="cal"></div></aside>
      </div>
    </section>

    <section id="panel-library" role="tabpanel" aria-labelledby="tab-library" hidden>
      <div class="filters">
        <label class="search"><span class="sr">Search the library</span><input id="lQ" type="search" placeholder="Search articles" autocomplete="off"></label>
        <select id="lYear" aria-label="Filter by year presented"><option value="">Any year</option></select>
        <select id="lPresenter" aria-label="Filter by presenter"><option value="">All presenters</option></select>
        <select id="lTag" aria-label="Filter by tag"><option value="">All tags</option></select>
      </div>
      <p class="count" id="libCount"></p>
      <div id="libList"></div>
    </section>
  </main>

  <p class="foot">Colleagues, this page is updated from the shared Google Sheets. Just update the sheet to update the page too. Updates show within a few minutes.</p>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="viewer" role="dialog" aria-modal="true" aria-labelledby="viewerTitle">
    <div class="viewer-head">
      <h2 id="viewerTitle">Slides</h2>
      <a class="btn small" id="viewerOpen" href="#" target="_blank" rel="noopener noreferrer">Open in new tab</a>
      <button class="btn small" data-act="close-viewer">Close</button>
    </div>
    <iframe id="viewerFrame" title="Slide preview" allow="fullscreen" referrerpolicy="no-referrer"></iframe>
  </div>
</div>

<script>
/* ============================================================
   SETUP: paste your two Google Sheet links here.
   In Google Sheets: File > Share > Publish to web > pick one tab > CSV > Publish.
   Copy the link it gives you. Do this once for the Timetable tab and once for the Library tab.
   Leave both empty to see example data.

  libraryCsv: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSHuy5r-joP0QTCnsTQebUlsfbP2RsQDGVcwxC-7bArD80fmPosCso2h3vEwkT79rtNjwSWWIZIE0_4/pub?gid=1811426031&single=true&output=csv',

};
</script>

<script>

function safeUrl(u){try{var x=new URL(String(u||'').trim());return (x.protocol==='https:'||x.protocol==='http:')?x.href:''}catch(e){return ''}}
function pad(n){return String(n).padStart(2,'0')}

function parseYmd(s){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s||''));if(!m)return null;var d=new Date(+m[1],+m[2]-1,+m[3]);return d.getMonth()===+m[2]-1?d:null}
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function addDays(n){var d=new Date();d.setDate(d.getDate()+n);return ymd(d)}

/* ---------- example data (shown only when no sheet is connected) ---------- */
var EX_SESSIONS=[

  {id:'x3',date:addDays(16),start:'14:00',end:'15:30',title:'Practice talk for the regional conference',presenter:'Presenter C',type:'Practice talk',location:'Seminar room',notes:'Bring written feedback.'},
  {id:'x4',date:addDays(23),start:'15:00',end:'16:00',title:'Guest seminar',presenter:'Presenter A',type:'Seminar',location:'Main hall',notes:''},
  {id:'x5',date:addDays(-5),start:'14:00',end:'15:00',title:'Journal club: article discussion',presenter:'Presenter B',type:'Journal club',location:'Seminar room',article:'Example article on household savings',notes:''},

  {id:'x7',date:addDays(-19),start:'14:00',end:'15:00',title:'Journal club: article discussion',presenter:'Presenter A',type:'Journal club',location:'Seminar room',article:'Example article on clinic attendance',notes:''},
  {id:'x8',date:addDays(-33),start:'14:00',end:'15:00',title:'Journal club: article discussion',presenter:'Presenter C',type:'Journal club',location:'Seminar room',article:'Example article on school readiness',notes:''}

function parseCSV(text){
  var rows=[],row=[],cur='',q=false,i=0;
  text=String(text||'').replace(/^\uFEFF/,'');
  for(;i<text.length;i++){
    var c=text[i];
    if(q){
      if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}
      else cur+=c;
    }else if(c==='"')q=true;
    else if(c===','){row.push(cur);cur=''}
    else if(c==='\n'||c==='\r'){
      if(c==='\r'&&text[i+1]==='\n')i++;
      row.push(cur);cur='';rows.push(row);row=[];
    }else cur+=c;
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return rows;
}
function toObjects(rows){
  if(!rows.length)return [];
  var head=rows[0].map(function(h){return String(h).trim().toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')});
  return rows.slice(1).filter(function(r){return r.some(function(c){return String(c).trim()!==''})}).map(function(r){
    var o={};head.forEach(function(h,i){if(h)o[h]=String(r[i]==null?'':r[i]).trim()});return o;
  });
}
function normDate(s){
  s=String(s||'').trim();if(!s)return '';
  var m=/^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s);
  if(m)return m[1]+'-'+pad(+m[2])+'-'+pad(+m[3]);
  m=/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/.exec(s);
  if(m)return m[3]+'-'+pad(+m[2])+'-'+pad(+m[1]); /* day/month/year */
  var t=new Date(s);
  return isNaN(t)?'':ymd(t);
}
function normTime(s){
  s=String(s||'').trim();if(!s)return '';
  var m=/^(\d{1,2}):(\d{2})(?::\d{2})?\s*([AaPp][Mm])?$/.exec(s);
  if(!m)return '';
  var h=+m[1];
  if(m[3]){var pm=/p/i.test(m[3]);if(pm&&h<12)h+=12;if(!pm&&h===12)h=0}
  return h>23?'':pad(h)+':'+m[2];
}
function mapSession(o,i){
  return {id:'s'+i,date:normDate(o.date),start:normTime(o.start||o.start_time),end:normTime(o.end||o.end_time),title:o.title||o.session||'',presenter:o.presenter||'',type:o.type||'',location:o.location||o.room||'',article:o.article||'',notes:o.notes||''};
}
function mapArticle(o,i){
  return {id:'a'+i,title:o.title||o.article||'',authors:o.authors||'',venue:o.venue||o.journal||'',year:(o.year||'').slice(0,4),url:o.url||o.article_link||'',presenter:o.presenter||o.presented_by||'',
    presentedOn:normDate(o.presented_on||o.date),tags:String(o.tags||'').split(/[,;]/).map(function(t){return t.trim()}).filter(Boolean),notes:o.notes||'',slidesUrl:o.slides_url||o.slides||''};
}
async function fetchCsv(url){
  var r=await fetch(url,{cache:'no-store'});
  if(!r.ok)throw new Error('http '+r.status);
  var t=await r.text();
  if(/^\s*<(!doctype|html)/i.test(t))throw new Error('not csv');
  return toObjects(parseCSV(t));
}

function icsEsc(s){return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n')}
function icsFold(line){var out=[],s=line;while(s.length>72){out.push(s.slice(0,72));s=' '+s.slice(72)}out.push(s);return out.join('\r\n')}
function plusMinutes(time,mins){var p=time.split(':'),t=Math.min(23*60+59,(+p[0])*60+(+p[1])+mins);return pad(Math.floor(t/60))+pad(t%60)+'00'}
function downloadIcs(s){
  var d=s.date.replace(/-/g,''),L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Surge PhD Cohort Meetings//EN','CALSCALE:GREGORIAN','BEGIN:VEVENT'];
  var stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+Z$/,'Z');
  L.push('UID:'+d+'-'+(s.start||'').replace(':','')+'-'+Math.abs(hash(s.title))+'@cohort-meetings');
  L.push('DTSTAMP:'+stamp);
  if(s.start){
    L.push('DTSTART:'+d+'T'+s.start.replace(':','')+'00');
    L.push('DTEND:'+d+'T'+(s.end?s.end.replace(':','')+'00':plusMinutes(s.start,60)));
  }else{
    var nx=parseYmd(s.date);nx.setDate(nx.getDate()+1);
    L.push('DTSTART;VALUE=DATE:'+d);
    L.push('DTEND;VALUE=DATE:'+ymd(nx).replace(/-/g,''));
  }
  L.push('SUMMARY:'+icsEsc(s.title));
  var link=safeUrl(s.location),desc=[];
  if(s.location&&!link)L.push('LOCATION:'+icsEsc(s.location));
  if(link){L.push('URL:'+link);desc.push('Join: '+link)}
  if(s.presenter)desc.push('Presenter: '+s.presenter);
  if(s.article)desc.push('Article: '+s.article);
  if(s.notes)desc.push(s.notes);
  if(desc.length)L.push('DESCRIPTION:'+icsEsc(desc.join('\n')));
  L.push('END:VEVENT','END:VCALENDAR');
  var blob=new Blob([L.map(icsFold).join('\r\n')+'\r\n'],{type:'text/calendar;charset=utf-8'});
  var a=document.createElement('a'),url=URL.createObjectURL(blob);
  a.href=url;a.download=(s.title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'session')+'.ics';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(url)},1000);
}

}
function renderChrome(){
  $$('.tab').forEach(function(b){b.setAttribute('aria-selected',String(b.getAttribute('data-tab')===S.tab))});
  $('#panel-timetable').hidden=S.tab!=='timetable';
  $('#panel-library').hidden=S.tab!=='library';
}
function refreshView(){
  renderNotice();renderUpdated();renderHero();fillFilters();renderTimetable();renderCalendar();renderLibrary();renderChrome();
}

/* ---------- slide preview ---------- */
function openPreview(a){
  var src=previewUrl(a.slidesUrl);if(!src)return;
  S.lastFocus=document.activeElement;
  $('#viewerTitle').textContent=a.title;
  $('#viewerOpen').href=safeUrl(a.slidesUrl);
  $('#viewerFrame').src=src;
  $('#overlay').hidden=false;
  $('#viewerOpen').focus();
}
function closePreview(){
  $('#overlay').hidden=true;$('#viewerFrame').src='about:blank';
  if(S.lastFocus&&S.lastFocus.focus)try{S.lastFocus.focus()}catch(e){}
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var act=el.getAttribute('data-act');
  if(act==='tab'){S.tab=el.getAttribute('data-tab');try{localStorage.setItem('rh-tab',S.tab)}catch(x){}renderChrome()}
  else if(act==='when'){S.when=el.getAttribute('data-when');S.day=null;renderTimetable();renderCalendar()}
  else if(act==='day'){var d=el.getAttribute('data-day');S.day=S.day===d?null:d;renderTimetable();renderCalendar()}
  else if(act==='clear-day'){S.day=null;renderTimetable();renderCalendar()}
  else if(act==='cal-prev'){S.cal=new Date(S.cal.getFullYear(),S.cal.getMonth()-1,1);renderCalendar()}
  else if(act==='cal-next'){S.cal=new Date(S.cal.getFullYear(),S.cal.getMonth()+1,1);renderCalendar()}
  else if(act==='reset-filters'){S.when='all';S.day=null;$('#fPresenter').value='';$('#fType').value='';renderTimetable();renderCalendar()}
  else if(act==='reset-lib'){$('#lQ').value='';$('#lYear').value='';$('#lPresenter').value='';$('#lTag').value='';renderLibrary()}
  else if(act==='refresh')load();
  else if(act==='theme')toggleTheme();
  else if(act==='ics'){var sid=el.getAttribute('data-id');var s=sessions().filter(function(x){return x.id===sid})[0];if(s)downloadIcs(s)}
  else if(act==='preview'){var id=el.getAttribute('data-id');var a=articles().filter(function(x){return x.id===id})[0];if(a)openPreview(a)}
  else if(act==='close-viewer')closePreview();
});
$('#overlay').addEventListener('click',function(e){if(e.target===this)closePreview()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#overlay').hidden)closePreview()});
$('#fPresenter').addEventListener('change',renderTimetable);
$('#fType').addEventListener('change',renderTimetable);
['#lYear','#lPresenter','#lTag'].forEach(function(s){$(s).addEventListener('change',renderLibrary)});
$('#lQ').addEventListener('input',renderLibrary);

/* ---------- loading ---------- */
async function load(){
  var cfg=window.CONFIG||{};
  var tUrl=safeUrl(cfg.timetableCsv),lUrl=safeUrl(cfg.libraryCsv);
  if(!tUrl&&!lUrl){S.mode='examples';S.err=false;refreshView();return}
  if(S.busy)return;
  S.busy=true;renderUpdated();
  var bad=false;
  try{
    var r=await Promise.all([
      tUrl?fetchCsv(tUrl).then(function(o){return o.map(mapSession)}).catch(function(){bad=true;return null}):Promise.resolve([]),
      lUrl?fetchCsv(lUrl).then(function(o){return o.map(mapArticle)}).catch(function(){bad=true;return null}):Promise.resolve([])
    ]);
    if(r[0])S.sessions=r[0];
    if(r[1])S.library=r[1];
    if(S.mode==='loading'&&(!r[0]&&!r[1])){S.sessions=[];S.library=[]}
    if(r[0]||r[1])S.updatedAt=new Date();
  }catch(e){bad=true}
  S.err=bad;S.mode='live';S.busy=false;
  refreshView();
}
renderTheme();
refreshView();
load();
var mins=Math.max(1,+((window.CONFIG||{}).refreshMinutes)||5);
setInterval(function(){if(!document.hidden)load()},mins*60000);
document.addEventListener('visibilitychange',function(){
  if(!document.hidden&&S.updatedAt&&Date.now()-S.updatedAt.getTime()>2*60000)load();
});
})();
</script>
</body>
